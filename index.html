<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="radcoach">
<meta name="theme-color" content="#2a78d6">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>radcoach</title>
<style>
:root{color-scheme:light dark;--page:#f4f3ef;--card:#fff;--card2:#f9f8f5;--text:#111;--text2:#55534e;--muted:#8f8d86;
--line:rgba(0,0,0,.08);--accent:#2a78d6;--accent2:#1baf7a;--hot:#eb6834;--good:#0ca30c;--warn:#e9a20c;--bad:#d03b3b;
--z1:#b7d3f6;--z2:#86b6ef;--z3:#5598e7;--z4:#2a78d6;--z5:#1c5cab;--z6:#104281;--z7:#0d366b;
--grad:linear-gradient(135deg,#2a78d6 0%,#1baf7a 100%);--shadow:0 6px 24px rgba(20,30,60,.08);
--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
@media (prefers-color-scheme:dark){:root{--page:#0b0b0c;--card:#18181a;--card2:#202023;--text:#f4f4f2;--text2:#c3c2b7;--muted:#86857e;
--line:rgba(255,255,255,.09);--accent:#3f8ff0;--accent2:#22b985;--shadow:0 6px 24px rgba(0,0,0,.4);
--z1:#184f95;--z2:#1c5cab;--z3:#256abf;--z4:#2a78d6;--z5:#3987e5;--z6:#6da7ec;--z7:#9ec5f4}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--page);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:calc(var(--safe-t) + 8px) 16px calc(var(--safe-b) + 84px);max-width:640px;margin:0 auto;overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}
h1{font-size:30px;line-height:1.1;margin:6px 0 2px;letter-spacing:-.02em} h2{font-size:19px;margin:24px 0 10px;letter-spacing:-.01em}
.sub{color:var(--text2);font-size:14px} .muted{color:var(--muted);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.iconbtn{border:0;background:var(--card);box-shadow:var(--shadow);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.hero{background:var(--grad);color:#fff;border-radius:26px;padding:18px 18px 14px;box-shadow:0 10px 30px rgba(42,120,214,.3);margin:14px 0 12px}
.hero.rest{background:linear-gradient(135deg,#1baf7a,#7cc96b)} .hero.race{background:linear-gradient(135deg,#eb6834,#fab219)}
.hero .k{font-size:13px;opacity:.85;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.hero .t{font-size:27px;font-weight:750;margin:4px 0 2px;letter-spacing:-.02em}
.hero .meta{font-size:15px;opacity:.92}
.hero .prof{background:rgba(255,255,255,.16);border-radius:14px;padding:8px 6px 4px;margin:12px 0 10px}
.hero .prof svg text{fill:#fff} .hero .tag{background:rgba(255,255,255,.22);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;background:var(--card2);color:var(--text)}
.hero .chip{background:rgba(255,255,255,.22);color:#fff} .chip.primary{background:var(--accent);color:#fff}
.chip.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)} .chip:disabled{opacity:.4}
.chip.on{background:var(--accent);color:#fff}
.second{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.25);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.tile{background:var(--card);border-radius:18px;padding:10px 8px;text-align:center;box-shadow:var(--shadow)}
.tile .v{font-size:22px;font-weight:750;letter-spacing:-.02em} .tile .l{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.dbadge{width:46px;flex:none;text-align:center;border-radius:14px;padding:5px 0;background:var(--card2)}
.dbadge b{display:block;font-size:18px;line-height:1.1} .dbadge span{font-size:11px;color:var(--text2);text-transform:uppercase}
.dbadge.today{background:var(--accent);color:#fff} .dbadge.today span{color:#fff}
.grow{flex:1;min-width:0} .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{height:18px;margin-top:4px} .right{text-align:right;font-size:13px;color:var(--text2);flex:none}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:7px;padding:1px 7px;margin:3px 4px 0 0;background:var(--card2);color:var(--text2)}
.tag.blue{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:#a06d00}
@media (prefers-color-scheme:dark){.tag.warn{color:var(--warn)}}
.wkhead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 4px}
.wkhead b{font-size:17px} .phase{font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;color:#fff;background:var(--accent)}
.phase.build{background:var(--hot)} .phase.peak{background:#c2185b} .phase.taper{background:var(--accent2)} .phase.recovery{background:#8f8d86}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:8px 10px calc(var(--safe-b) + 8px);
background:color-mix(in srgb,var(--page) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:5}
.tabbar button{flex:1;max-width:120px;border:0;background:none;padding:4px 0;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.tabbar button i{display:block;font-style:normal;font-size:22px;line-height:1.2;filter:grayscale(1);opacity:.6}
.tabbar button.on{color:var(--accent)} .tabbar button.on i{filter:none;opacity:1}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--card);
border-radius:26px 26px 0 0;padding:10px 18px calc(var(--safe-b) + 22px);transform:translateY(105%);transition:transform .25s ease;z-index:21}
.sheet.open{transform:none} .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.steps{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px} .steps td{padding:6px 2px;border-bottom:1px solid var(--line)}
.steps td:last-child{text-align:right;font-variant-numeric:tabular-nums} .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--safe-b) + 86px);max-width:600px;margin:0 auto;background:#111;color:#fff;
border-radius:16px;padding:12px 16px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.3);opacity:0;transform:translateY(10px);transition:.25s;z-index:30;pointer-events:none}
.toast.show{opacity:1;transform:none}
.banner{background:color-mix(in srgb,var(--warn) 16%,var(--card));border-radius:16px;padding:10px 14px;font-size:14px;margin:10px 0}
.lock{min-height:80vh;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:12px}
.logo{width:92px;height:92px;border-radius:24px;margin:0 auto;box-shadow:0 10px 30px rgba(42,120,214,.35)}
.field{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:17px}
.big{width:100%;padding:14px;border-radius:14px;border:0;background:var(--grad);color:#fff;font-weight:700;font-size:17px;cursor:pointer}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px}
.rpe button{border:0;border-radius:10px;padding:9px 0;font-weight:700;cursor:pointer;background:var(--card2)}
.rpe button.on{background:var(--accent);color:#fff}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:4px} .bar i{display:block;height:100%;background:var(--grad);border-radius:4px}
.lv{display:grid;grid-template-columns:1fr 2fr 34px;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.chart text{font-size:10px;fill:var(--muted)}
ul.tips{padding-left:18px;margin:6px 0} ul.tips li{margin:5px 0;font-size:14px;color:var(--text2)}
.fc{border-left:5px solid var(--fc)} .fc.green{--fc:var(--good)} .fc.yellow{--fc:var(--warn)} .fc.red{--fc:var(--bad)}
.fcbar{position:relative;height:30px;margin:12px 4px 2px} .fcbar:before{content:"";position:absolute;top:13px;left:0;right:0;height:4px;border-radius:2px;background:var(--card2)}
.fcbar i{position:absolute;display:block} .fcbar .rng{top:9px;height:12px;border-radius:6px;background:var(--fc);opacity:.35}
.fcbar .tgt{top:2px;height:26px;width:3px;background:var(--text)} .fcbar .dot{top:7px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--fc);border:2px solid var(--card)}
.hidden{display:none!important} .spin{animation:sp 1s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar hidden" id="tabs">
  <button data-tab="today" class="on"><i>🏠</i>Heute</button>
  <button data-tab="plan"><i>🗓️</i>Plan</button>
  <button data-tab="history"><i>📈</i>Verlauf</button>
  <button data-tab="form"><i>💪</i>Form</button>
</nav>
<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetbody"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
